{% load i18n %}
<!-- 360 Viewer Modal -->
<div class="modal fade" id="panoramaModal" tabindex="-1" aria-labelledby="panoramaModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content" style="background: var(--mc-charcoal); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-lg); overflow: hidden;">
            <div class="modal-header border-bottom-0" style="padding: var(--sp-md) var(--sp-lg); background: rgba(0, 0, 0, 0.2);">
                <h5 class="modal-title text-white d-flex align-items-center" id="panoramaModalLabel">
                    <i class="bi bi-badge-3d text-primary me-2"></i>Visite Virtuelle 360°
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0" style="position: relative;">
                <div id="modal-panorama-viewer" style="width: 100%; height: 65vh; min-height: 400px; background: #000;"></div>
                
                <!-- Compass Indicator Widget -->
                <div id="pano-compass-widget" style="display: none;">
                    <div class="compass-dial">
                        <span class="compass-label compass-n">N</span>
                        <span class="compass-label compass-e">E</span>
                        <span class="compass-label compass-s">S</span>
                        <span class="compass-label compass-w">W</span>
                        <div id="pano-compass-needle"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let modalViewer = null;

/**
 * Multi-scene virtual tour configuration.
 * Each scene maps to a Showroom record by slug.
 * hotSpots with type:"scene" create floor-anchored arrows
 * that transition between rooms using Pannellum's native fade.
 *
 * NOTE: hotspot pitch/yaw values are initial estimates.
 * Open the browser console and click on the floor to see
 * "Calibrate Coords - Pitch: XX  Yaw: YY" — use those
 * values to fine-tune placement.
 */
const TOUR_SCENES = {
    "clinique-tanger": {
        "title": "Clinique Médicale",
        "type": "equirectangular",
        "panorama": "/media/showrooms/clinique-360.jpg",
        "autoLoad": true,
        "autoRotate": -1,
        "compass": false,
        "showZoomCtrl": true,
        "showFullscreenCtrl": true,
        "mouseZoom": true,
        "hfov": 100,
        "minHfov": 40,
        "maxHfov": 120,
        "pitch": 0,
        "yaw": 0,
        "friction": 0.15,
        "hotSpots": [
            {
                "pitch": -25,
                "yaw": -35,
                "type": "scene",
                "text": "Cabinet KineDoc",
                "sceneId": "kinedoc-tanger",
                "cssClass": "mc-floor-arrow"
            },
            {
                "pitch": -25,
                "yaw": 35,
                "type": "scene",
                "text": "Pharmacie & Parapharmacie",
                "sceneId": "pharmacie-tanger",
                "cssClass": "mc-floor-arrow"
            }
        ]
    },
    "kinedoc-tanger": {
        "title": "Cabinet KineDoc - Tanger",
        "type": "equirectangular",
        "panorama": "/media/showrooms/kinedoc-360.jpg",
        "autoLoad": true,
        "autoRotate": -1,
        "compass": false,
        "showZoomCtrl": true,
        "showFullscreenCtrl": true,
        "mouseZoom": true,
        "hfov": 100,
        "minHfov": 40,
        "maxHfov": 120,
        "pitch": 0,
        "yaw": 0,
        "friction": 0.15,
        "hotSpots": [
            {
                "pitch": -25,
                "yaw": 145,
                "type": "scene",
                "text": "Clinique Médicale",
                "sceneId": "clinique-tanger",
                "cssClass": "mc-floor-arrow"
            },
            {
                "pitch": -25,
                "yaw": -45,
                "type": "scene",
                "text": "Pharmacie & Parapharmacie",
                "sceneId": "pharmacie-tanger",
                "cssClass": "mc-floor-arrow"
            }
        ]
    },
    "pharmacie-tanger": {
        "title": "Pharmacie & Parapharmacie",
        "type": "equirectangular",
        "panorama": "/media/showrooms/pharmacie-360.jpg",
        "autoLoad": true,
        "autoRotate": -1,
        "compass": false,
        "showZoomCtrl": true,
        "showFullscreenCtrl": true,
        "mouseZoom": true,
        "hfov": 100,
        "minHfov": 40,
        "maxHfov": 120,
        "pitch": 0,
        "yaw": 0,
        "friction": 0.15,
        "hotSpots": [
            {
                "pitch": -25,
                "yaw": -145,
                "type": "scene",
                "text": "Clinique Médicale",
                "sceneId": "clinique-tanger",
                "cssClass": "mc-floor-arrow"
            },
            {
                "pitch": -25,
                "yaw": 45,
                "type": "scene",
                "text": "Cabinet KineDoc",
                "sceneId": "kinedoc-tanger",
                "cssClass": "mc-floor-arrow"
            }
        ]
    }
};

function open360Modal(slug, title, type, sourceUrl) {
    // Set header title
    document.getElementById('panoramaModalLabel').innerHTML =
        '<i class="bi bi-badge-3d text-primary me-2"></i>' + title;

    // Show modal
    var modalElement = document.getElementById('panoramaModal');
    var modal = new bootstrap.Modal(modalElement);
    modal.show();

    // Loading spinner
    var container = document.getElementById('modal-panorama-viewer');
    container.innerHTML =
        '<div class="d-flex justify-content-center align-items-center h-100">' +
        '<div class="spinner-border text-primary" role="status">' +
        '<span class="visually-hidden">Loading...</span></div></div>';

    var compassWidget = document.getElementById('pano-compass-widget');
    if (compassWidget) compassWidget.style.display = 'none';

    // Initialize viewer after modal is fully shown
    var onShown = function () {
        container.innerHTML = '';
        if (modalViewer) {
            try { modalViewer.destroy(); } catch (e) {}
            modalViewer = null;
        }

        if (type === 'panorama') {
            if (typeof pannellum === 'undefined') {
                container.innerHTML =
                    '<div class="text-center text-white py-5">' +
                    '<p>Error: Pannellum library not loaded.</p></div>';
                return;
            }

            var hasScene = TOUR_SCENES.hasOwnProperty(slug);

            if (hasScene) {
                // ── Multi-scene tour ──
                modalViewer = pannellum.viewer('modal-panorama-viewer', {
                    "default": {
                        "firstScene": slug,
                        "sceneFadeDuration": 1200
                    },
                    "scenes": TOUR_SCENES
                });
            } else {
                // ── Standalone panorama (not in tour config) ──
                modalViewer = pannellum.viewer('modal-panorama-viewer', {
                    "type": "equirectangular",
                    "panorama": sourceUrl,
                    "autoLoad": true,
                    "autoRotate": -1,
                    "compass": false,
                    "showZoomCtrl": true,
                    "showFullscreenCtrl": true,
                    "mouseZoom": true,
                    "hfov": 100,
                    "minHfov": 40,
                    "maxHfov": 120,
                    "pitch": 0,
                    "yaw": 0,
                    "friction": 0.15
                });
            }

            // Show compass once loaded
            modalViewer.on('load', function () {
                if (compassWidget) compassWidget.style.display = 'flex';
            });

            // Live compass rotation
            modalViewer.on('change', function () {
                var needle = document.getElementById('pano-compass-needle');
                if (needle && modalViewer) {
                    var yaw = modalViewer.getYaw();
                    needle.style.transform =
                        'translate(-50%, -50%) rotate(' + (-yaw) + 'deg)';
                }
            });

            // Debug: click anywhere on floor to log pitch/yaw for hotspot calibration
            modalViewer.on('mousedown', function (event) {
                try {
                    var coords = modalViewer.mouseEventToCoords(event);
                    if (coords) {
                        console.log(
                            'Calibrate Coords — Pitch:',
                            coords[0].toFixed(2),
                            ' Yaw:',
                            coords[1].toFixed(2)
                        );
                    }
                } catch (e) {}
            });

        } else if (type === 'matterport') {
            container.innerHTML =
                '<div class="ratio ratio-16x9 w-100 h-100" style="height:65vh;min-height:400px;">' +
                '<iframe src="' + sourceUrl + '" class="w-100 h-100" ' +
                'allowfullscreen allow="xr-spatial-tracking" frameborder="0"></iframe></div>';
        }

        modalElement.removeEventListener('shown.bs.modal', onShown);
    };

    modalElement.addEventListener('shown.bs.modal', onShown);

    // Cleanup on close
    var onHidden = function () {
        if (modalViewer) {
            try { modalViewer.destroy(); modalViewer = null; } catch (e) {}
        }
        container.innerHTML = '';
        if (compassWidget) compassWidget.style.display = 'none';
        modalElement.removeEventListener('hidden.bs.modal', onHidden);
    };
    modalElement.addEventListener('hidden.bs.modal', onHidden);
}
</script>
