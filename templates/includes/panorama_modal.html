{% load i18n %}
<!-- 360 Viewer Modal -->
<div class="modal fade" id="panoramaModal" tabindex="-1" aria-labelledby="panoramaModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content" style="background: var(--mc-charcoal); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-lg); overflow: hidden;">
            <div class="modal-header border-bottom-0" style="padding: var(--sp-md) var(--sp-lg); background: rgba(0, 0, 0, 0.2);">
                <h5 class="modal-title text-white d-flex align-items-center" id="panoramaModalLabel">
                    <i class="bi bi-badge-3d text-primary me-2"></i>Visite Virtuelle 360°
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0" style="position: relative;">
                <div id="modal-panorama-viewer" style="width: 100%; height: 65vh; min-height: 400px; background: #000;"></div>
                <!-- Navigation arrows overlay (Google Maps style) -->
                <div id="pano-nav-controls" style="display:none;">
                    <button class="pano-nav-btn pano-nav-forward" onclick="panoNavigate('forward')" title="Move forward">
                        <i class="bi bi-chevron-up"></i>
                    </button>
                    <button class="pano-nav-btn pano-nav-left" onclick="panoNavigate('left')" title="Turn left">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <button class="pano-nav-btn pano-nav-right" onclick="panoNavigate('right')" title="Turn right">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                    <button class="pano-nav-btn pano-nav-back" onclick="panoNavigate('back')" title="Turn around">
                        <i class="bi bi-chevron-down"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let modalViewer = null;

function clickFloorHotspot(yaw) {
    if (!modalViewer) return;
    modalViewer.setAutoRotate(0);
    // Pan to target yaw, zoom in (hfov: 50), look down slightly (pitch: -20)
    modalViewer.lookAt(-20, yaw, 50, 1000);
    // After 1000ms, zoom back out to look normal
    setTimeout(function() {
        modalViewer.lookAt(0, yaw, 100, 800);
    }, 1100);
}

function panoNavigate(direction) {
    if (!modalViewer) return;
    
    // Stop auto-rotation when user navigates
    modalViewer.setAutoRotate(0);
    
    var currentYaw = modalViewer.getYaw();
    var currentPitch = modalViewer.getPitch();
    var currentHfov = modalViewer.getHfov();
    var targetYaw = currentYaw;
    var targetPitch = currentPitch;
    var targetHfov = currentHfov;
    
    switch(direction) {
        case 'forward':
            // Zoom in + look slightly down (simulate walking forward)
            targetHfov = Math.max(50, currentHfov - 20);
            targetPitch = Math.max(-30, currentPitch - 5);
            break;
        case 'back':
            // Turn 180° (look behind) + zoom out
            targetYaw = currentYaw + 180;
            targetHfov = Math.min(120, currentHfov + 10);
            targetPitch = 0;
            break;
        case 'left':
            // Turn 90° left
            targetYaw = currentYaw - 90;
            break;
        case 'right':
            // Turn 90° right
            targetYaw = currentYaw + 90;
            break;
    }
    
    // Smooth animated transition
    modalViewer.lookAt(targetPitch, targetYaw, targetHfov, 800);
}

function open360Modal(slug, title, type, sourceUrl) {
    // Set title
    document.getElementById('panoramaModalLabel').innerHTML = '<i class="bi bi-badge-3d text-primary me-2"></i>' + title;
    
    // Show modal
    const modalElement = document.getElementById('panoramaModal');
    const modal = new bootstrap.Modal(modalElement);
    modal.show();
    
    // Clear container
    const container = document.getElementById('modal-panorama-viewer');
    container.innerHTML = '<div class="d-flex justify-content-center align-items-center h-100"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>';
    
    // Hide nav controls initially
    document.getElementById('pano-nav-controls').style.display = 'none';
    
    // Initialize viewer after modal is fully shown
    const onShown = function() {
        container.innerHTML = '';
        if (modalViewer) {
            try { modalViewer.destroy(); } catch(e) {}
            modalViewer = null;
        }
        
        if (type === 'panorama') {
            // Check if pannellum library is loaded
            if (typeof pannellum !== 'undefined') {
                modalViewer = pannellum.viewer('modal-panorama-viewer', {
                    type: 'equirectangular',
                    panorama: sourceUrl,
                    autoLoad: true,
                    autoRotate: -2,
                    compass: true,
                    showZoomCtrl: true,
                    showFullscreenCtrl: true,
                    mouseZoom: true,
                    hfov: 100,
                    minHfov: 40,
                    maxHfov: 120,
                    pitch: 0,
                    yaw: 0,
                    friction: 0.15,
                    keyboardZoom: true,
                    draggable: true,
                    disableKeyboardCtrl: false,
                    hotSpots: [
                        {
                            pitch: -25,
                            yaw: 0,
                            cssClass: 'mc-floor-arrow',
                            createTooltipFunc: function(hotSpotDiv) {
                                hotSpotDiv.addEventListener('click', function() {
                                    clickFloorHotspot(0);
                                });
                            }
                        },
                        {
                            pitch: -25,
                            yaw: 90,
                            cssClass: 'mc-floor-arrow',
                            createTooltipFunc: function(hotSpotDiv) {
                                hotSpotDiv.addEventListener('click', function() {
                                    clickFloorHotspot(90);
                                });
                            }
                        },
                        {
                            pitch: -25,
                            yaw: 180,
                            cssClass: 'mc-floor-arrow',
                            createTooltipFunc: function(hotSpotDiv) {
                                hotSpotDiv.addEventListener('click', function() {
                                    clickFloorHotspot(180);
                                });
                            }
                        },
                        {
                            pitch: -25,
                            yaw: 270,
                            cssClass: 'mc-floor-arrow',
                            createTooltipFunc: function(hotSpotDiv) {
                                hotSpotDiv.addEventListener('click', function() {
                                    clickFloorHotspot(270);
                                });
                            }
                        }
                    ]
                });
                // Show nav controls once loaded
                modalViewer.on('load', function() {
                    document.getElementById('pano-nav-controls').style.display = 'block';
                });
            } else {
                container.innerHTML = '<div class="text-center text-white py-5"><p>Erreur: Pannellum 3D viewer library not loaded.</p></div>';
            }
        } else if (type === 'matterport') {
            container.innerHTML = `
                <div class="ratio ratio-16x9 w-100 h-100" style="height: 65vh; min-height: 400px;">
                    <iframe src="${sourceUrl}" class="w-100 h-100" allowfullscreen allow="xr-spatial-tracking" frameborder="0"></iframe>
                </div>
            `;
        }
        
        modalElement.removeEventListener('shown.bs.modal', onShown);
    };
    
    modalElement.addEventListener('shown.bs.modal', onShown);
    
    // Cleanup when hidden
    const onHidden = function() {
        if (modalViewer) {
            try {
                modalViewer.destroy();
                modalViewer = null;
            } catch(e) {}
        }
        container.innerHTML = '';
        document.getElementById('pano-nav-controls').style.display = 'none';
        modalElement.removeEventListener('hidden.bs.modal', onHidden);
    };
    
    modalElement.addEventListener('hidden.bs.modal', onHidden);
}
</script>
